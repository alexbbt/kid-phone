# Kid Phone — Home Assistant Lovelace dashboard
#
# After MQTT discovery, entities appear under device "Kid Phone".
#
# Call buttons: unique_id is stable (…_cN_call). Friendly names follow the
# person ("Call Grandma"). Entity ids below assume first discovery used
# "Call contact N"; if HA named them from a person (e.g. call_grandma), pick
# the right entities under Settings → Devices → Kid Phone.
#
# Config entities (Contact N name/number, schedules, bedtime) appear only when
# the phone’s MQTT expose mode is "full". The Phone view works in "controls".
#
# Schedule windows use plain text, not raw JSON:
#   YNYYYYN 17:00-20:00
# Seven chars Sun→Sat (Y=on), then start-end. Empty clears the window.
# See docs/mqtt.md.
#
# Paste into a new dashboard (raw YAML) or include as a view.

title: Kid Phone
views:
  - title: Phone
    path: kid-phone
    cards:
      - type: entities
        title: Status
        entities:
          - entity: sensor.kid_phone_call_state
            name: Call
          - entity: sensor.kid_phone_last_error
            name: Last error
          - entity: sensor.kid_phone_wifi_signal
            name: WiFi
          - entity: sensor.kid_phone_firmware
            name: Firmware
          - entity: button.kid_phone_hang_up
            name: Hang up

      - type: entities
        title: Call someone
        entities:
          - entity: button.kid_phone_call_contact_1
          - entity: button.kid_phone_call_contact_2
          - entity: button.kid_phone_call_contact_3
          - entity: button.kid_phone_call_contact_4
          - entity: button.kid_phone_call_contact_5

      - type: markdown
        content: |
          **Call buttons** show the person’s name (Call Grandma). Available
          hours apply; bedtime does not (same as the setup page). Call and
          hang-up are never retained.

          Use the **Setup** view when MQTT expose is **full** (contacts,
          schedules, bedtime).

  - title: Setup
    path: kid-phone-setup
    cards:
      - type: entities
        title: Call length & bedtime
        entities:
          - entity: number.kid_phone_max_call_length
            name: Longest call (minutes)
          - entity: switch.kid_phone_bedtime
            name: Bedtime on
          - entity: text.kid_phone_bedtime_starts
            name: Lights off at
          - entity: text.kid_phone_bedtime_ends
            name: Lights on at
          - entity: text.kid_phone_home_time_zone_name
            name: Home time zone (name)
          - entity: text.kid_phone_home_time_zone
            name: Home time zone (POSIX)

      - type: entities
        title: Contact 1
        entities:
          - entity: button.kid_phone_call_contact_1
            name: Call
          - entity: text.kid_phone_contact_1_name
            name: Name
          - entity: text.kid_phone_contact_1_number
            name: Number
          - entity: switch.kid_phone_contact_1_schedule
            name: Schedule on
          - entity: text.kid_phone_contact_1_time_zone_name
            name: Their time zone (name)
          - entity: text.kid_phone_contact_1_time_zone
            name: Their time zone (POSIX)
          - entity: text.kid_phone_contact_1_window_1
            name: Window 1
          - entity: text.kid_phone_contact_1_window_2
            name: Window 2
          - entity: text.kid_phone_contact_1_window_3
            name: Window 3
          - entity: text.kid_phone_contact_1_window_4
            name: Window 4

      - type: markdown
        content: |
          **Window format:** `YNYYYYN 17:00-20:00`  
          Letters are Sun→Sat (`Y` = that day). Example weekdays 5–8 pm:
          `NYYYYYN 17:00-20:00`. Clear a window by saving an empty value.

          Config titles stay **Contact N** so renaming a person only changes
          the name value, not the entity.

      - type: entities
        title: Contact 2
        entities:
          - entity: button.kid_phone_call_contact_2
            name: Call
          - entity: text.kid_phone_contact_2_name
            name: Name
          - entity: text.kid_phone_contact_2_number
